name: App release

# release-please.yml calls this when it cuts a Zulu release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the Mac DMG is attached to, e.g. zulu-v1.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the Mac DMG is attached to, e.g. zulu-v1.3.0
        required: true
        type: string

permissions:
  contents: write

# Two uploads racing would fight over the same build number, so releases queue
# rather than cancel each other.
concurrency:
  group: app-release
  cancel-in-progress: false

env:
  # Team IDs are not secret; they appear in every shipped binary.
  APPLE_TEAM_ID: 65AMD2STXG
  # Matches the Sparkle package version in App/project.yml.
  SPARKLE_VERSION: 2.10.1

jobs:
  apple:
    name: TestFlight and Mac DMG
    # Same image as ci.yml: iOS 27 deployment target needs the Xcode 27 runner.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Test ZuluKit
        working-directory: Packages/ZuluKit
        run: swift test

      - name: Derive build number
        id: build-number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # One .p12 holds the development, distribution and Developer ID identities.
      # xcodebuild archive signs for development and -exportArchive re-signs for
      # distribution, so a runner with only the distribution certificate cannot get
      # past archiving. The Mac DMG is re-signed with Developer ID.
      - name: Import signing certificates
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/zulu-signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          p12="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$p12"

          # Without this codesign stops to ask for keychain access and the run hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null

          # Prepend rather than replace, so the runner's login keychain still resolves.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool only looks in a handful of fixed directories; this is one of them.
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$API_KEY_ID.p8"
          echo "$API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          set -euo pipefail
          xcodegen generate
          # DEVELOPMENT_TEAM repeats what project.yml already sets, so a fork building
          # under its own team overrides it from APPLE_TEAM_ID alone. CODE_SIGN_IDENTITY
          # is not set alongside it. Automatic signing rejects a manually chosen identity
          # outright.
          xcodebuild archive \
            -project Zulu.xcodeproj \
            -scheme Zulu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Zulu.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export signed ipa
        working-directory: App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Zulu.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Zulu.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_KEY_ISSUER_ID"

      # Signed by the same team and with the same entitlements as a local build, so
      # both share one sandbox container, keychain access group and iCloud store.
      - name: Archive Mac app
        working-directory: App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Zulu.xcodeproj \
            -scheme ZuluMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ZuluMac.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # An App Store Connect API key cannot create a Developer ID profile, so the
      # profile is made once by hand and stored as a secret.
      - name: Install Developer ID profile
        env:
          PROFILE: ${{ secrets.APPLE_MAC_DEVELOPER_ID_PROFILE }}
        run: |
          set -euo pipefail
          dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$dir"
          profile="$RUNNER_TEMP/developer-id.provisionprofile"
          echo "$PROFILE" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
          mv "$profile" "$dir/$uuid.provisionprofile"

      - name: Export Developer ID app
        working-directory: App
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZuluMac.xcarchive" \
            -exportPath "$RUNNER_TEMP/mac-export" \
            -exportOptionsPlist ExportOptionsMac.plist

      - name: Build DMG
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto "$RUNNER_TEMP/mac-export/Zulu.app" "$staging/Zulu.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname Zulu \
            -srcfolder "$staging" \
            -format UDZO \
            -ov "$RUNNER_TEMP/Zulu.dmg"
          codesign --sign "Developer ID Application" \
            --keychain "$SIGNING_KEYCHAIN" \
            --timestamp \
            "$RUNNER_TEMP/Zulu.dmg"

      # Gatekeeper blocks a downloaded Developer ID app until Apple has notarized it.
      # Stapling lets it open without asking Apple first.
      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/Zulu.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_KEY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Zulu.dmg"

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/Zulu.dmg" --clobber

      # Runs after stapling, since the signature covers the DMG's final bytes.
      # Zulu.md beside the DMG becomes the update's release notes.
      - name: Generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          gh release download "$SPARKLE_VERSION" -R sparkle-project/Sparkle \
            -p "Sparkle-$SPARKLE_VERSION.tar.xz" -O "$tools/sparkle.tar.xz"
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"

          updates="$RUNNER_TEMP/updates"
          mkdir -p "$updates"
          cp "$RUNNER_TEMP/Zulu.dmg" "$updates/Zulu.dmg"
          gh release view "$TAG" --json body --jq .body > "$updates/Zulu.md"

          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          echo "$SPARKLE_PRIVATE_KEY" | "$tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases" \
            --embed-release-notes \
            -o "$site/appcast.xml" \
            "$updates"

      - name: Stage appcast for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Keep the ipa and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zulu-${{ steps.build-number.outputs.value }}
          path: |
            ${{ runner.temp }}/export/Zulu.ipa
            ${{ runner.temp }}/Zulu.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"

  appcast:
    name: Publish appcast
    needs: apple
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}appcast.xml
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
