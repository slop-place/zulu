name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build (Apple)
    # Zulu's deployment target is iOS 27, so it needs the Xcode 27 image. That image
    # is in public preview and arm64-only.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build and test ZuluKit
        working-directory: Packages/ZuluKit
        run: swift test

      - name: Build app
        working-directory: App
        run: |
          xcodegen generate
          xcodebuild build \
            -project Zulu.xcodeproj \
            -scheme Zulu \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Mac app
        working-directory: App
        run: |
          xcodebuild build \
            -project Zulu.xcodeproj \
            -scheme ZuluMac \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  service:
    name: Build and test (service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: service/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: docker build -t zulu-notifyd:ci .
