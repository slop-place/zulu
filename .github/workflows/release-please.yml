name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      app: ${{ contains(fromJSON(steps.release.outputs.paths_released || '[]'), '.') }}
      app-tag: ${{ steps.release.outputs.tag_name }}
      notifyd: ${{ contains(fromJSON(steps.release.outputs.paths_released || '[]'), 'service') }}
      notifyd-version: ${{ steps.release.outputs['service--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # A tag pushed with GITHUB_TOKEN triggers no workflows, so releases are called from here.
  app:
    name: Zulu
    needs: release-please
    if: needs.release-please.outputs.app == 'true'
    # A called workflow gets no more than this, and the appcast deploy needs Pages.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.app-tag }}
    secrets: inherit

  notifyd:
    name: Notification service
    needs: release-please
    if: needs.release-please.outputs.notifyd == 'true'
    uses: ./.github/workflows/notifyd-release.yml
    with:
      version: ${{ needs.release-please.outputs.notifyd-version }}
