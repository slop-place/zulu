name: Zulu
options:
  bundleIdPrefix: com.bwees
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  ZuluKit:
    path: ../Packages/ZuluKit
targets:
  Zulu:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets, ../Shared/Sources]
    dependencies:
      - package: ZuluKit
        product: ZulipAPI
      - package: ZuluKit
        product: ZuluStore
      - package: ZuluKit
        product: ZuluSync
      - package: ZuluKit
        product: ZuluMarkup
      - package: ZuluKit
        product: ZuluEmoji
      - package: ZuluKit
        product: ZuluCompose
      - package: ZuluKit
        product: ZuluPolls
    info:
      path: Zulu-Info.plist
      properties:
        CFBundleDisplayName: Zulu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this, every TestFlight build sits at "Missing Compliance" until a
        # human answers the export questionnaire in App Store Connect. Zulu only
        # speaks HTTPS to a Zulip server, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # App Store Connect rejects an iPad build without every orientation, since
        # iPad multitasking can put the app in any of them.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Zulip server hardcodes a zulip:// redirect for the SSO flow, so the
        # scheme is not ours to choose.
        CFBundleURLTypes:
          - CFBundleURLName: com.bwees.zulu
            CFBundleURLSchemes: [zulip]
    entitlements:
      path: Zulu.entitlements
      properties:
        # Shared with the Mac app, so both read the same groups and channel settings.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.bwees.zulu
        # Export for the App Store rewrites this to production.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bwees.zulu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # release-please bumps this in its release PR.
        MARKETING_VERSION: "1.9.0" # x-release-please-version
        # Placeholder only. The release workflow overrides this on the xcodebuild
        # command line with the commit count, so the checked-in value never reaches
        # App Store Connect.
        CURRENT_PROJECT_VERSION: "1"
        # A device build now carries a real application-identifier, which moves its
        # keychain access group. One already signed in reads back no API key and
        # lands on the login screen once. Simulator builds stay unsigned and unaffected.
        DEVELOPMENT_TEAM: 65AMD2STXG
        CODE_SIGN_STYLE: Automatic

  ZuluMac:
    type: application
    platform: macOS
    sources: [../Mac/Sources, ../Mac/Assets.xcassets, ../Mac/AppIcon.icon, ../Shared/Sources]
    dependencies:
      - package: ZuluKit
        product: ZulipAPI
      - package: ZuluKit
        product: ZuluStore
      - package: ZuluKit
        product: ZuluSync
      - package: ZuluKit
        product: ZuluMarkup
      - package: ZuluKit
        product: ZuluEmoji
      - package: ZuluKit
        product: ZuluCompose
      - package: ZuluKit
        product: ZuluPolls
    info:
      path: ZuluMac-Info.plist
      properties:
        CFBundleDisplayName: Zulu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # The Zulip server hardcodes a zulip:// redirect for the SSO flow, so the
        # scheme is not ours to choose.
        CFBundleURLTypes:
          - CFBundleURLName: com.bwees.zulu
            CFBundleURLSchemes: [zulip]
    entitlements:
      path: ZuluMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.bwees.zulu
    settings:
      base:
        PRODUCT_NAME: Zulu
        PRODUCT_BUNDLE_IDENTIFIER: com.bwees.zulu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.9.0" # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"
        # The iCloud entitlement needs a provisioning profile, which the team provides.
        # A secret already written to the sandbox container is still read back from it.
        DEVELOPMENT_TEAM: 65AMD2STXG
        CODE_SIGN_STYLE: Automatic
        # Notarization rejects a Developer ID build without it.
        ENABLE_HARDENED_RUNTIME: YES
